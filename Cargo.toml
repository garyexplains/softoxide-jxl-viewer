[workspace]
members = [".", "jxl-native"]
resolver = "3"

[package]
name = "jxlviewer"
version = "0.1.0"
edition = "2024"
description = "SoftOxide JXL Viewer — native JPEG XL image viewer, editor and converter (Windows/macOS/Linux)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/garyexplains/softoxide-jxl-viewer"
readme = "README.md"
keywords = ["jpeg-xl", "jxl", "image-viewer", "image-converter", "gui"]
categories = ["multimedia::images"]
authors = ["Gary Sims"]

[dependencies]
jxl-native = { path = "jxl-native" }

# GUI — rendered entirely by the app itself (no OS widget toolkits).
# The renderer is picked explicitly at runtime in src/lib.rs::run_gui
# (windows: wgpu with Direct3D 12, everything else: glow/OpenGL), so Cargo
# feature unification in other dependencies can never silently change it.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wgpu_no_default_features",
    "default_fonts",
    "x11",
    "wayland",
] }

# wgpu features needed by the Windows renderer, enabled explicitly so feature
# unification cannot accidentally drop them (eframe's plain "wgpu" feature
# would pull *all* wgpu backends; wgpu_no_default_features lets us pick):
#   - "dx12": Direct3D 12 backend (its deps are windows-target-gated, so this
#     is inert when building for macOS/Linux)
#   - "wgsl": egui ships its GPU shaders as WGSL source
#   - "std":  required with default-features off for native builds
# Version must track the wgpu that eframe 0.37 / egui-wgpu 0.37 links against.
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl", "std"] }

# Common formats (PNG / JPEG / GIF / BMP / TIFF / WebP)
image = "0.25"

# Pure-Rust JPEG XL decode (with moxcms for sRGB color management)
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }

# Fast SIMD resampling for edit ops
fast_image_resize = "6"

# JPEG encoding with quality + subsampling control
jpeg-encoder = "0.6"

# Native file dialogs (open/save pickers only; no image support from OS)
rfd = "0.15"

# Animated GIF decode (full disposal/blend handling)
gif = "0.14"

[build-dependencies]
# Embeds assets/icon.ico into the Windows executable (Explorer/taskbar icon).
winresource = "0.1"

[dev-dependencies]
filetime = "0.2"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
