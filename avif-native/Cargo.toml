[package]
name = "avif-native"
version = "0.1.0"
edition = "2024"
description = "Static, permissively-licensed AVIF decode over vendored libavif + libaom (decoder-only API; a thin fixture-encoder exists behind a cargo feature)"
license = "MIT OR Apache-2.0"
links = "avif-oxide"

[features]
# Exposes a single-image AV1/AVIF encoder used only by
# `examples/gen_avif.rs` to (re)generate the small test fixtures committed
# under assets/avif/. The shipped app/CLI never calls it.
fixture-encoder = []

[build-dependencies]
cmake = "0.1"
dunce = "1"
